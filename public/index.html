<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZeIA — Monitoreo de energía</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">Z</span>
      <div>
        <h1>ZeIA</h1>
        <p>Monitoreo de energía</p>
      </div>
    </div>
    <div id="dash-meta" class="dash-meta"></div>
    <div class="topbar-actions">
      <span id="mode-badge" class="mode-badge">CARGANDO</span>
      <button id="admin-btn" class="admin-btn" title="Volver al panel del administrador">Panel</button>
    </div>
  </header>

  <main id="dashboard" class="dashboard">
    <div id="empty-state" class="empty-state">
      <h2>¿Qué quieres saber?</h2>
      <p>Pregunta por consumo, comparaciones o estado de tus puntos de medición.</p>
      <div class="suggestions">
        <button class="chip">¿Cuánto costó mi consumo este mes?</button>
        <button class="chip">¿Gasté más que el mes anterior?</button>
        <button class="chip">Consumo de Chiller 1 esta semana</button>
        <button class="chip">Compara Chiller 1 vs Chiller 2</button>
        <button class="chip">¿Qué tableros tengo?</button>
        <button class="chip">Alertas de la última semana</button>
      </div>
    </div>
    <div id="cards" class="cards"></div>
  </main>

  <footer class="chatbar">
    <div id="chat-log" class="chat-log" hidden></div>
    <form id="chat-form" class="chat-form">
      <input id="chat-input" type="text" autocomplete="off"
        placeholder="Pregunta por consumo, comparaciones, alertas..." />
      <button type="submit" id="chat-send">Enviar</button>
    </form>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
